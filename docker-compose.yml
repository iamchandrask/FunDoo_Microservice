services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    volumes:
    - sql_data:/var/opt/mssql 
    # healthcheck:
    #   test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Pass123", "-Q", "SELECT 1", "-C"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # optional but recommended

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data   # optional
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  userservice:
    environment:
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__UserDb=Server=sqlserver;Database=FundooUsersDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    build:
      context: .
      dockerfile: src/Services/UserService/Fundoo.UserService.API/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
      - rabbitmq

  notesservice:
    environment:
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__UserDb=Server=sqlserver;Database=FundooNoteDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    build:
      context: .
      dockerfile: src/Services/NotesService/Fundoo.NotesService.API/Dockerfile
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
      - redis
      - rabbitmq

  labelservice:
    environment:
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__UserDb=Server=sqlserver;Database=FundooLabelDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    build:
      context: .
      dockerfile: src/Services/LabelService/Fundoo.LabelService.API/Dockerfile
    ports:
      - "5003:8080"
    depends_on:
      - sqlserver

  reminderservice:
    environment:
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__UserDb=Server=sqlserver;Database=FundooReminderDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    build:
      context: .
      dockerfile: src/Services/ReminderService/Fundoo.ReminderService.API/Dockerfile
    ports:
      - "5004:8080"
    depends_on:
      - sqlserver

  collaborationservice:
    environment:
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__UserDb=Server=sqlserver;Database=FundooCollaburatorDb;User Id=sa;Password=YourStrong@Pass123;TrustServerCertificate=True;
    build:
      context: .
      dockerfile: src/Services/CollaborationService/Fundoo.CollaborationService.API/Dockerfile
    ports:
      - "5005:8080"
    depends_on:
      - sqlserver

  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Fundoo.ApiGateway/Dockerfile
    ports:
      - "7000:8080"
    depends_on:
      - userservice
      - notesservice
      - labelservice
      - reminderservice
      - collaborationservice
  # 👇 ADD THIS AT THE END
volumes:
  sql_data:
  rabbitmq_data:
  redis_data: